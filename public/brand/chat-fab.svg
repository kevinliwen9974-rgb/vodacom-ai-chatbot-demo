    <!-- back bubble with ? -->
    <path
      d="M38 8c14.4 0 26 10.1 26 22.5S52.4 53 38 53c-2.4 0-4.7-.3-6.9-.8L20 58l2.2-10.2C16.5 43.6 12 37.5 12 30.5 12 18.1 23.6 8 38 8z"
