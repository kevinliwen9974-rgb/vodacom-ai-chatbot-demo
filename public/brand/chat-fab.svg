    >?</text>
    <!-- front bubble with ... -->
    <path
      d="M62 22c11.6 0 21 8.1 21 18.1S73.6 58.2 62 58.2c-1.9 0-3.7-.2-5.4-.7L46 62l1.8-8.2C43.6 51.2 41 46.8 41 40.1 41 30.1 50.4 22 62 22z"
